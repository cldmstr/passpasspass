name: Two Over One
includes:
  - multi_two_diamond
  - strong_two_clubs
  - strong_notrump
  - five_card_major
conventions:
  - bid: 1D
    conditions:
      all:
        - hcp: [11, 17]
        - suit_length:
            diamonds: [4, 6]
  - bid: 1C
    conditions:
      all:
        - hcp: [11, 17]
        - suit_length:
            clubs: [2, 6]
