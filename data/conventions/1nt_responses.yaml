name: 1nt_responses
conventions:
  # Jacoby transfer to hearts: 5+ hearts (any strength)
  - bid: 2D
    conditions:
      all:
        - partner_bid: "1NT"
        - suit_length:
            hearts: [5, 13]

  # Jacoby transfer to spades: exactly 5 spades
  # (6+ spades: use 2NT weakness transfer instead)
  - bid: 2H
    conditions:
      all:
        - partner_bid: "1NT"
        - suit_length:
            spades: [5, 5]

  # Natural game: 10-14 HCP, balanced, no 4-card major — direct 3NT
  - bid: 3NT
    conditions:
      all:
        - partner_bid: "1NT"
        - hcp: [10, 14]
        - balanced: true
        - suit_length:
            hearts: [0, 3]
        - suit_length:
            spades: [0, 3]

  # Weakness transfer to spades: 6-9 HCP, 6+ spades (play 3S)
  # Listed before Stayman so 6-card spade suits don't trigger Stayman
  - bid: 2NT
    conditions:
      all:
        - partner_bid: "1NT"
        - hcp: [6, 9]
        - suit_length:
            spades: [6, 13]

  # Transfer to diamonds: 6-9 HCP, 6+ diamonds (play 3D)
  # Listed before Stayman so 6-card diamond suits don't block
  - bid: 3C
    conditions:
      all:
        - partner_bid: "1NT"
        - hcp: [6, 9]
        - suit_length:
            diamonds: [6, 13]

  # Baron: 8+ HCP, no 5-card major; asks opener to bid 4-card suits upward
  - bid: 2S
    conditions:
      all:
        - partner_bid: "1NT"
        - hcp: [8, 40]

  # Stayman: 4+ in at least one major; fires for weaker hands (< 8 HCP) not handled above
  - bid: 2C
    conditions:
      all:
        - partner_bid: "1NT"
        - any:
            - suit_length:
                hearts: [4, 13]
            - suit_length:
                spades: [4, 13]
