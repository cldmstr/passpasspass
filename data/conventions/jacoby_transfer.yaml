name: jacoby_transfer
conventions:
  # Jacoby transfer to hearts: 5+ hearts (any strength)
  - bid: 2D
    conditions:
      all:
        - partner_bid: "1NT"
        - suit_length:
            hearts: [5, 13]

  # Jacoby transfer to spades: exactly 5 spades
  # (6+ spades: use 2NT weakness transfer instead)
  - bid: 2H
    conditions:
      all:
        - partner_bid: "1NT"
        - suit_length:
            spades: [5, 5]
