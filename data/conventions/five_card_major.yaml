name: five_card_major
conventions:
  - bid: 1S
    conditions:
      all:
        - rule_of_20: true
        - hcp: [11, 17]
        - suit_length:
            spades: [5, 6]
  - bid: 1H
    conditions:
      all:
        - rule_of_20: true
        - hcp: [11, 17]
        - suit_length:
            hearts: [5, 6]
  - bid: 1D
    conditions:
      all:
        - rule_of_20: true
        - hcp: [11, 17]
        - suit_length:
            diamonds: [5, 6]
  - bid: 1C
    conditions:
      all:
        - rule_of_20: true
        - hcp: [11, 17]
        - suit_length:
            clubs: [2, 6]
